name: inventocharm
description: Inventory management application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  bloc: ^8.1.4
  csv: ^6.0.0
  device_info_plus: ^9.1.2
  equatable: ^2.0.5
  flutter_bloc: ^8.1.6
  font_awesome_flutter: ^10.7.0
  image_picker: ^1.0.7
  http: ^1.2.2
  intl: ^0.19.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  pocketbase: ^0.23.0
  persistent_bottom_nav_bar: ^6.2.1
  qr_code_scanner: ^1.0.1
  smooth_page_indicator: ^1.1.0
  user_repository:
    path: packages/user_repository

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/